name: Daily Weather Pipeline Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f weather_data_pipeline/requirements.txt ]; then
            pip install -r weather_data_pipeline/requirements.txt
          fi

      - name: Run weather pipeline
        run: |
          python weather_data_pipeline/scripts/run_pipeline.py

      - name: Run pytest assertions
        run: |
          pytest weather_data_pipeline/tests/

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_data_pipeline/data/
          if git diff --staged --quiet; then
            echo "No new weather data to commit. Pipeline clean."
          else
            git commit -m "chore(data): incremental weather update [skip ci]"
            git push
          fi
