name: Daily Weather Pipeline CI

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r weather_data_pipeline/requirements.txt

      - name: Ensure data directory exists
        run: |
          mkdir -p weather_data_pipeline/data

      - name: Run weather pipeline
        run: |
          python weather_data_pipeline/scripts/run_pipeline.py

      - name: Run pipeline assertions
        run: |
          python -m pytest -v weather_data_pipeline/tests/
